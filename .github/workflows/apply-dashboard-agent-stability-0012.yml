name: Apply Dashboard and Agent stability 0012
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dashboard-agent-stability-0012.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated stability scripts
        shell: python
        run: |
          from pathlib import Path

          # Dashboard: add ONLY the isolated stability layer. Do not alter dashboard content.
          p=Path('Plant Dashboard.dc.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dashboard-stability.js?v=20260808-0012" defer></script>'
          if tag not in s:
              lines=s.splitlines()
              inserted=False
              out=[]
              for line in lines:
                  out.append(line)
                  if (not inserted) and 'support.js' in line and '<script' in line:
                      out.append(tag)
                      inserted=True
              s='\n'.join(out)+'\n'
              if not inserted:
                  s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')

          # Home: cache-bust only the agent shell. Leave the validated Home header/support untouched.
          for name in ['index.html','Brain Recycle Home.dc.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              import re
              s=re.sub(r'agent-shell\.js\?v=[^"\']+', 'agent-shell.js?v=20260808-0012', s)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Plant Dashboard.dc.html' index.html 'Brain Recycle Home.dc.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore traceability stability and fix AI Agent embed'
          git push
