name: Direct mobile repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-mobile-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Home and Dashboard HTML directly
        shell: python
        run: |
          from pathlib import Path

          stamp = '20260808-0005'

          # HOME: remove the two historical CSS caps that constrain the whole Jotform agent
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.jotform-agent-widget,.jf-agent-widget{max-width:76px!important;max-height:76px!important}', '')
          s = s.replace('iframe[src*="jotform"],.jotform-agent-widget,.jf-agent-widget{max-width:72px!important;max-height:72px!important}', '')
          s = s.replace('<script src="./support.js"></script>', f'<script src="./support.js?v={stamp}"></script>', 1)
          marker = 'br-direct-home-mobile-repair'
          if marker not in s:
              css = '''\n<style id="br-direct-home-mobile-repair">\n@media(max-width:760px){\n  iframe[src*="jotform"],iframe[src*="jotfor.ms"],.jotform-agent-widget,.jf-agent-widget{max-width:none!important;max-height:none!important;}\n  #br-mobile-fixed-nav .br-fixed-menu,header .sm{width:58px!important;min-width:58px!important;height:58px!important;border:2px solid rgba(255,255,255,.42)!important;border-radius:14px!important;background:rgba(255,255,255,.12)!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;}\n  #br-mobile-fixed-nav .br-fixed-menu i,header .sm i{font-size:38px!important;line-height:1!important;color:#fff!important;}\n}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          # DASHBOARD: force the real checkbox label/button large in the HTML itself
          p = Path('Plant Dashboard.dc.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="./support.js"></script>', f'<script src="./support.js?v={stamp}"></script>', 1)
          marker = 'br-direct-dashboard-menu-repair'
          if marker not in s:
              css = '''\n<style id="br-direct-dashboard-menu-repair">\n@media(max-width:760px){\n  html body x-dc .dash-shell .dash-mobile-menu-btn{display:flex!important;width:58px!important;height:58px!important;min-width:58px!important;flex:0 0 58px!important;align-items:center!important;justify-content:center!important;background:rgba(255,255,255,.16)!important;border:2px solid rgba(255,255,255,.50)!important;border-radius:14px!important;box-shadow:0 5px 16px rgba(0,0,0,.24)!important;padding:0!important;color:#fff!important;opacity:1!important;cursor:pointer!important;}\n  html body x-dc .dash-shell .dash-mobile-menu-btn i{font-size:38px!important;line-height:1!important;color:#fff!important;opacity:1!important;}\n  html body x-dc .dash-shell .dash-main>header{height:72px!important;min-height:72px!important;padding:0 14px!important;align-items:center!important;}\n}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify targeted repairs
        shell: bash
        run: |
          set -e
          ! grep -Fq '.jotform-agent-widget,.jf-agent-widget{max-width:76px!important;max-height:76px!important}' index.html
          ! grep -Fq 'iframe[src*="jotform"],.jotform-agent-widget,.jf-agent-widget{max-width:72px!important;max-height:72px!important}' index.html
          grep -Fq 'br-direct-home-mobile-repair' index.html
          grep -Fq 'br-direct-dashboard-menu-repair' 'Plant Dashboard.dc.html'
          grep -Fq 'support.js?v=20260808-0005' index.html
          grep -Fq 'support.js?v=20260808-0005' 'Plant Dashboard.dc.html'
      - name: Commit repaired HTML
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 'Plant Dashboard.dc.html'
          git commit -m 'Directly repair mobile Jotform and Dashboard menu' || exit 0
          git push origin HEAD:main
