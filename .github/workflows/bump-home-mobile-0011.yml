name: Bump Home mobile runtime 0011
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-home-mobile-0011.yml'
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Home cache-busting versions
        shell: python
        run: |
          from pathlib import Path
          for name in ['index.html','Brain Recycle Home.dc.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('./support.js?v=20260808-0010','./support.js?v=20260808-0011')
              s=s.replace('./agent-shell.js?v=20260808-0010','./agent-shell.js?v=20260808-0011')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 'Brain Recycle Home.dc.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate Home header and AI panel mobile fix 0011'
          git push
