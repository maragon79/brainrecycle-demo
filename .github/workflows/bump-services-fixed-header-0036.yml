name: Activate Services fixed mobile header 0036
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-services-fixed-header-0036.yml'
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust Services support runtime only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('Brain Recycle Servicios.dc.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="\./support\.js(?:\?v=[^"]*)?"></script>', '<script src="./support.js?v=20260808-0036"></script>', s, count=1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Brain Recycle Servicios.dc.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate fixed Services mobile header without touching agent'
          git push
